[package]
name = "mdbook-sitemap"
version = "0.1.2"
rust-version = "1.88"
edition = "2024"
description = "A sitemap.xml generator backend for mdBook"
license = "MIT"
repository = "https://github.com/sonneko/mdbook-sitemap"
readme = "README.md"
keywords = ["mdbook", "sitemap", "seo", "documentation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mdbook-sitemap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
