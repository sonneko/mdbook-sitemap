[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# Pin the version used in CI; update with `dist init` when intentionally upgrading.
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Verify the release tag and run checks before cargo-dist hosts or publishes.
local-artifacts-jobs = ["./verify-release"]
# Defer the GitHub Release announcement until crates.io publishing succeeds.
github-release = "announce"
publish-jobs = ["./publish-crates"]

[dist.github-custom-job-permissions]
"verify-release" = { contents = "read" }
"publish-crates" = { contents = "read", id-token = "write" }
