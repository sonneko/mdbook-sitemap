on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-action:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdbook-sitemap
        uses: ./
        with:
          version: v0.1.3

      - name: Verify binary
        run: mdbook-sitemap --version