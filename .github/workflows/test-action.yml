on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdbook-sitemap
        uses: ./
        with:
          version: v0.1.5

      - name: Verify binary
        run: mdbook-sitemap --version