name: 'Setup mdbook-sitemap'
description: 'Install mdbook-sitemap binary from GitHub Releases for use with mdbook build'
author: 'sonneko'

branding:
  icon: 'map'
  color: 'orange'

inputs:
  version:
    description: 'Version of mdbook-sitemap to install (e.g., v0.1.4 or latest)'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Install mdbook-sitemap
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        OS="$(uname -s)"
        ARCH="$(uname -m)"

        case "$OS" in
          Linux)
            case "$ARCH" in
              x86_64)  TARGET="x86_64-unknown-linux-gnu" ;;
              aarch64) TARGET="aarch64-unknown-linux-gnu" ;;
              *) echo "Unsupported Linux arch: $ARCH"; exit 1 ;;
            esac
            EXT="tar.xz"
            ;;
          Darwin)
            case "$ARCH" in
              x86_64) TARGET="x86_64-apple-darwin" ;;
              arm64)  TARGET="aarch64-apple-darwin" ;;
              *) echo "Unsupported macOS arch: $ARCH"; exit 1 ;;
            esac
            EXT="tar.xz"
            ;;
          MINGW*|MSYS*|CYGWIN*)
            TARGET="x86_64-pc-windows-msvc"
            EXT="zip"
            ;;
          *)
            echo "Unsupported OS: $OS"
            exit 1
            ;;
        esac

        if [ "$VERSION" = "latest" ]; then
          TAG=$(gh api repos/sonneko/mdbook-sitemap/releases/latest --jq '.tag_name')
        else
          TAG="$VERSION"
        fi

        BASE_TMP="${RUNNER_TEMP:-/tmp}"
        mkdir -p "$BASE_TMP"

        INSTALL_DIR="$HOME/.mdbook-sitemap/bin"
        UNPACK_DIR="$(mktemp -d "$BASE_TMP/mdbook-sitemap-XXXXXX")"
        ARCHIVE_PATH="${UNPACK_DIR}/archive.${EXT}"

        mkdir -p "$INSTALL_DIR"

        ASSET_NAME="mdbook-sitemap-${TARGET}.${EXT}"
        URL="https://github.com/sonneko/mdbook-sitemap/releases/download/${TAG}/${ASSET_NAME}"

        echo "Downloading ${URL}..."
        curl -fsSL "$URL" -o "$ARCHIVE_PATH"

        if [ "$EXT" = "tar.xz" ]; then
          tar -xf "$ARCHIVE_PATH" -C "$UNPACK_DIR"
          BIN_PATH=$(find "$UNPACK_DIR" -name "mdbook-sitemap" -type f | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "Binary mdbook-sitemap not found in archive"
            exit 1
          fi
          mv "$BIN_PATH" "$INSTALL_DIR/mdbook-sitemap"
          chmod  x "$INSTALL_DIR/mdbook-sitemap"
        else
          unzip -q "$ARCHIVE_PATH" -d "$UNPACK_DIR/extracted"
          BIN_PATH=$(find "$UNPACK_DIR/extracted" -name "mdbook-sitemap.exe" -type f | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "Binary mdbook-sitemap.exe not found in archive"
            exit 1
          fi
          mv "$BIN_PATH" "$INSTALL_DIR/mdbook-sitemap.exe"
        fi

        rm -rf "$UNPACK_DIR"

        if command -v cygpath >/dev/null 2>&1; then
          WIN_INSTALL_DIR="$(cygpath -w "$INSTALL_DIR")"
          echo "$WIN_INSTALL_DIR" >> "$GITHUB_PATH"
        else
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        fi

        echo "Installed mdbook-sitemap (${TAG}) to $INSTALL_DIR"